# Configuration with K=18258 to test the hypothesis that Almeida et al. (2022)
# ran their numerical simulations with K≈18258 rather than the K=22200 listed
# in their Table 1. With K=18258, F_bar≈11037 and epsilon≈2759, which would
# reproduce their reported J*≈1.46e5.
#
# All other parameters are identical to configs/almeida2022.yaml.

biological:
  beta_E: 10.0
  delta_E: 0.03
  delta_M: 0.1
  delta_F: 0.04
  delta_s: 0.12
  nu_E: 0.05
  nu: 0.49
  gamma_s: 1.0
  K: 18258.0  # hypothesis value — see almeida2022.yaml for K=22200

control:
  T: 150.0
  U_max: 5000.0
  epsilon: null  # null = F_bar / 4

numerical:
  rtol: 1.0e-8
  atol: 1.0e-8
  n_collocation: 300
  singular_eps: 1.0e-12
  solver_method: "RK45"
  apopt_rtol: 1.0e-6
