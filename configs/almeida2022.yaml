# Configuration replicating Almeida et al. (2022), Table 1.
# Aedes polynesiensis, 74 ha island in French Polynesia.

biological:
  beta_E: 10.0
  delta_E: 0.03
  delta_M: 0.1
  delta_F: 0.04
  delta_s: 0.12
  nu_E: 0.05
  nu: 0.49
  gamma_s: 1.0
  K: 22200.0

control:
  T: 150.0
  U_max: 5000.0
  epsilon: null  # null = F_bar / 4

numerical:
  rtol: 1.0e-8
  atol: 1.0e-8
  n_collocation: 300
  singular_eps: 1.0e-12
  solver_method: "RK45"
  apopt_rtol: 1.0e-6  # APOPT NLP tolerance — Almeida et al. (2022) use 1e-6