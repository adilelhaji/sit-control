# Alternative configuration matching Join, Almeida & Fliess (2026), Sec. 5.2.
# Differs from configs/almeida2022.yaml only in K (calibration parameter).
# K=22200 corresponds to a different field-calibration scenario; cost
# functional values are NOT directly comparable with Almeida (2022) Table 2.

biological:
  beta_E: 10.0
  delta_E: 0.03
  delta_M: 0.1
  delta_F: 0.04
  delta_s: 0.12
  nu_E: 0.05
  nu: 0.49
  gamma_s: 1.0
  K: 22200.0  # Join, Almeida & Fliess (2026), Sec. 5.2

control:
  T: 150.0
  U_max: 5000.0
  epsilon: null

numerical:
  rtol: 1.0e-8
  atol: 1.0e-8
  n_collocation: 300
  singular_eps: 1.0e-12
  solver_method: "RK45"
  apopt_rtol: 1.0e-6
