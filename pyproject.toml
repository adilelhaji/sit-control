[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sit-control"
version = "0.1.0"
description = "Optimal control for the sterile insect technique (SIT)"
authors = ["Adil <tu@email.com>"]
readme = "README.md"
packages = [{include = "sit_control", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "2.4.4"
scipy = "1.17.1"
gekko = "1.3.2"
matplotlib = "3.10.9"
pyyaml = "6.0.3"
tqdm = "4.67.3"
gymnasium = {version = "<1.2.3", optional = true}
stable-baselines3 = {version = "2.8.0", optional = true}
torch = {version = "2.12.0", optional = true}
scikit-learn = {version = "1.8.0", optional = true}

[tool.poetry.extras]
rl = ["gymnasium", "stable-baselines3", "torch", "scikit-learn", "tqdm"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
mypy = ">=1.7"
ruff = ">=0.1"
pre-commit = ">=3.5"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=sit_control --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]